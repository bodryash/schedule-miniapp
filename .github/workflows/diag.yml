name: Диагностика бота

# Запускается вручную, когда бот молчит. Ничего не меняет: только спрашивает
# сервер, жив ли он, и Telegram — что с вебхуком и какая последняя ошибка.
on:
  workflow_dispatch:
    inputs:
      mark:
        description: "Строка, которую искать в app.js на сервере (проверка, что выкладка дошла)"
        required: false
        default: ""

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Сервер бота отвечает?
        run: |
          for url in https://api.bodryash.ru/healthz https://app.bodryash.ru/; do
            curl -s -o /dev/null -m 20 -w "$url → HTTP %{http_code} за %{time_total} с\n" "$url" || echo "$url → не отвечает"
          done

      - name: Что бот говорит о себе
        run: |
          curl -fsS -m 20 https://api.bodryash.ru/healthz | python3 -c "
          import json, sys
          h = json.load(sys.stdin)
          names = {'uptime': 'работает, с', 'telegramOk': 'отправка в Telegram работает', 'tickAge': 'минутная задача была, с назад',
                   'cpuCores': 'ядер процессора', 'loadAvg': 'загрузка за 1/5/15 мин', 'ramTotalMb': 'память всего, МБ',
                   'ramFreeMb': 'память свободно, МБ', 'botRssMb': 'бот занимает, МБ',
                   'errors': 'ошибок', 'diskFree': 'свободно на диске, %', 'backupAge': 'копия базы, ч назад'}
          for k, v in h.items():
              print(f'{names.get(k, k)}: {v}')
          " || echo "healthz не ответил"

      - name: Замер отклика (200 запросов, по 20 сразу)
        run: |
          python3 - <<'PY'
          import time, urllib.request, concurrent.futures as cf
          url = "https://api.bodryash.ru/healthz"
          def one(_):
              t = time.time()
              try:
                  urllib.request.urlopen(url, timeout=20).read()
                  return time.time() - t
              except Exception:
                  return None
          t0 = time.time()
          with cf.ThreadPoolExecutor(20) as ex:
              res = list(ex.map(one, range(200)))
          ok = sorted(r for r in res if r is not None)
          print(f"ответили {len(ok)} из 200, всего {time.time()-t0:.1f} с, ~{len(ok)/(time.time()-t0):.0f} запросов/с")
          if ok:
              print(f"медиана {ok[len(ok)//2]*1000:.0f} мс, p95 {ok[int(len(ok)*.95)-1]*1000:.0f} мс, худший {ok[-1]*1000:.0f} мс")
          PY

      - name: Ссылка-приглашение группы создаётся?
        run: |
          # Тот же запрос, что шлёт кнопка «Позвать группу». Код зависит только
          # от факультета и группы, повторный запрос ничего не дублирует.
          for origin in https://app.bodryash.ru https://beta.bodryash.ru; do
            echo "с $origin:"
            curl -sS -m 20 -X POST https://api.bodryash.ru/invite -H "Origin: $origin" \
              -d '{"tenant":"msu-fgp","group":"321гид","name":"321гид"}' -D - -o /tmp/r.txt | grep -i "^HTTP\|access-control" || true
            cat /tmp/r.txt; echo
          done

      - name: Подслушка (форум) на сервере отвечает?
        continue-on-error: true
        run: |
          # Без подписи Telegram форум должен ответить 401: значит, код форума на сервере живой.
          curl -s -m 20 -X POST https://api.bodryash.ru/forum/list -d '{}' -w "\n/forum/list без подписи → HTTP %{http_code} (ждём 401)\n" || echo "форум не ответил"
          for url in https://beta.bodryash.ru https://fgp-schedule-beta.bodryash.workers.dev; do
            curl -fsS -m 20 "$url/forum.js?v=$(date +%s)" 2>/dev/null | grep -q openComposer && echo "$url: экран форума есть" || echo "$url: экрана форума нет"
          done
          curl -fsS -m 20 "https://app.bodryash.ru/forum.js?v=$(date +%s)" >/dev/null 2>&1 && echo "app.bodryash.ru: экран форума ЕСТЬ у студентов" || echo "app.bodryash.ru: экрана форума нет (так и надо, пока не выкатили)"

      - name: Что Telegram знает о вебхуке
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request
          base = f"https://api.telegram.org/bot{os.environ['BOT_TOKEN']}"
          me = json.load(urllib.request.urlopen(f"{base}/getMe", timeout=20))
          print("Бот:", "@" + me["result"]["username"] if me.get("ok") else me)
          info = json.load(urllib.request.urlopen(f"{base}/getWebhookInfo", timeout=20))["result"]
          print("Вебхук:", info.get("url") or "НЕ ЗАДАН")
          print("Ждут доставки:", info.get("pending_update_count"))
          print("IP:", info.get("ip_address"))
          if info.get("last_error_date"):
              ago = int(time.time() - info["last_error_date"])
              print(f"Последняя ошибка {ago // 60} мин назад:", info.get("last_error_message"))
          else:
              print("Ошибок доставки нет")
          PY

      - name: Чей сервер бота
        run: |
          sudo apt-get install -y -qq whois dnsutils netcat-openbsd >/dev/null 2>&1 || true
          ip=$(dig +short api.bodryash.ru | tail -1)
          echo "api.bodryash.ru → $ip (обратное имя: $(dig +short -x "$ip"))"
          whois "$ip" | grep -iE '^(netname|descr|org-name|organisation|country|role|address|abuse-mailbox)' | head -20
          for port in 22 80 443; do
            nc -z -w 5 "$ip" $port && echo "порт $port открыт" || echo "порт $port закрыт"
          done

      - name: Какая версия приложения у пользователей
        run: |
          for url in https://app.bodryash.ru https://beta.bodryash.ru https://bodryash.github.io/schedule-miniapp; do
            js=$(curl -fsS -m 20 "$url/app.js?v=$(date +%s)" || true)
            if [ -z "$js" ]; then echo "$url → app.js не открылся"; continue; fi
            echo "$url:"
            for mark in GIFTED_THEMES BIRTHDAYS "const WEEKS = 5" renderMonth FLAG_THEMES ${{ inputs.mark && format('"{0}"', inputs.mark) || '' }}; do
              echo "$js" | grep -q "$mark" && echo "  есть: $mark" || echo "  НЕТ: $mark"
            done
          done

      - name: Свежие ли расписания на сервере
        run: |
          python3 - <<'PY'
          import json, time, urllib.request
          def get(url):
              try:
                  return json.load(urllib.request.urlopen(f"{url}?v={int(time.time())}", timeout=20))
              except Exception as e:
                  return {"_error": str(e)[:80]}
          tenants = get("https://bodryash.github.io/schedule-miniapp/data/tenants.json")
          stale = 0
          print(f"{'факультет':32} {'GitHub':12} {'сервер':12}")
          for t in tenants:
              path = f"data/{t['path'] + '/' if t.get('path') else ''}schedule.json"
              gh = get(f"https://bodryash.github.io/schedule-miniapp/{path}")
              sv = get(f"https://app.bodryash.ru/{path}")
              a = (gh.get("meta") or {}).get("updated") or gh.get("_error", "?")
              b = (sv.get("meta") or {}).get("updated") or sv.get("_error", "?")
              mark = "" if a == b else "  ← отстаёт"
              stale += a != b
              print(f"{t['id'][:32]:32} {str(a)[:12]:12} {str(b)[:12]:12}{mark}")
          print(f"\nОтстают на сервере: {stale} из {len(tenants)}")
          PY
