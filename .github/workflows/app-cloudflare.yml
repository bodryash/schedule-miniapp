name: Запасная копия приложения на Cloudflare

# Основное приложение (docs/ ветки main) — копией на Cloudflare:
# https://fgp-schedule-app.bodryash.workers.dev/
# Если свой сервер лежит, сторож (monitor.yml) переключает кнопку бота сюда,
# и расписание у студентов продолжает открываться.
on:
  push:
    branches: [main]
    paths: ["docs/**", ".github/workflows/app-cloudflare.yml"]
  workflow_dispatch:

concurrency: app-cloudflare

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Выложить docs/ ветки main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || unset CLOUDFLARE_ACCOUNT_ID
          mkdir -p /tmp/app && cd /tmp/app
          npx --yes wrangler@4 deploy --name fgp-schedule-app --assets "$GITHUB_WORKSPACE/docs" \
            --compatibility-date 2026-09-11
      - name: Копия отвечает?
        run: |
          sleep 5
          curl -s -o /dev/null -m 20 -w "копия → HTTP %{http_code}\n" https://fgp-schedule-app.bodryash.workers.dev/ || true
